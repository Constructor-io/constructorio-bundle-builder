name: Run Diffend

on:
  pull_request:
    branches:
      - '**'
concurrency:
  group: run-diffend-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  diffend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          # Diffend's npm wrapper crashes ("s.warn is not a function") on the
          # npm that ships with Node 22. This job only runs `npm install` for
          # the supply-chain scan, so it stays on 18.13.0.
          node-version: '18.13.0'
      - name: Install Diffend (Mend)
        run: npm install -g https://my.diffend.io/releases/npm/stable.tgz
      - name: Install dependencies with Diffend
        run: diffend npm install

