<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constructor.io PLP - Example</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- The PLP component will mount to this element -->
    <div id="cio-plp-container"></div>

    <!-- Include the bundled JS file -->
    <script src="../../dist/cio-plp/custom-cio-plp.iife.js"></script>

    <script>
      // Basic usage - mount to a custom selector
      CioPlp({
        selector: '#cio-plp-container',
        apiKey: 'YOUR_CONSTRUCTOR_API_KEY',
      });

      // With Shopify defaults (uses predefined Shopify selector and configuration)
      // CioPlp({
      //   useShopifyDefaults: true,
      //   apiKey: 'YOUR_CONSTRUCTOR_API_KEY',
      // });

      // With all options
      // CioPlp({
      //   selector: '#cio-plp-container',  // CSS selector for the container element
      //   apiKey: 'YOUR_CONSTRUCTOR_API_KEY',
      //   includeCSS: true,                // Include default styles (default: true)
      //   useShopifyDefaults: false,       // Use Shopify default configuration
      //   // ...additional CustomCioPlp props
      // });

      // To unmount the component and clean up resources:
      // CioPlp.unmount('#cio-plp-container');
    </script>
  </body>
</html>
